/* ============================================================
   Vega Strike web port - core: vec math, seeded RNG, market
   model with stock dynamics, ship config, save/load
   Units: 1 engine unit = 1 Mm = 1000 km. Credits = VS credits.
   ============================================================ */
"use strict";

const V = {
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  scale:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:(a)=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:(a)=>{const l=V.len(a)||1;return [a[0]/l,a[1]/l,a[2]/l];},
  clone:(a)=>[a[0],a[1],a[2]],
};
const RAD = (d)=>d*Math.PI/180, DEG = (r)=>r*180/Math.PI;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const RAD2 = (d)=>d*Math.PI/180;

function mulberry32(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619) & 0xFFFFFFFF;
  return h >>> 0;
}

/* ---------- universe lookups ---------- */
const SYS = {};
for (const s of VS_DATA.systems) {
  if (s.star) s.star.pos = [s.star.x, s.star.y, s.star.z];
  for (const p of s.planets) p.pos = [p.x, p.y, p.z];
  for (const b of s.bases) b.pos = [b.x, b.y, b.z];
  for (const j of s.jumps) j.pos = [j.x, j.y, j.z];
  SYS[s.name] = s;
}
const SYS_NAMES = VS_DATA.systems.map(s => s.name);
const GOOD_BY_FILE = {};
for (const g of VS_DATA.goods) GOOD_BY_FILE[g.file] = g;
const SHIP_BY_NAME = {};
for (const s of VS_DATA.ships) SHIP_BY_NAME[s.name] = s;

function baseId(sname, bname) { return sname + "::" + bname; }
function findBase(bid) {
  const [sn, bn] = bid.split("::");
  const s = SYS[sn];
  if (!s) return null;
  return s.bases.find(b => b.name === bn) || null;
}
function jumpsFrom(sname) { return SYS[sname].jumps; }

/* ---------- economy (verified in scripts/vsport/verify_game.py) ----------
   price(base, good, day) = good.price * mult
   mult = seeded variation in [0.75,1.35] * stock response
   stock response: x = (s0 - stock)/s0  ->  * clamp(1 + 0.35*x, 0.6, 1.6)
   selling fills stock (price drops), buying empties it (price rises),
   restock toward s0 at 0.8%/s. Contraband only traded at pirate bases. */
const DAY_SEC = 600;
function marketMult0(bid, gf, day) {
  const rng = mulberry32(hashStr(bid + "|" + gf + "|" + day));
  return 0.75 + 0.6 * rng();
}
function baseStock0(bid, gf) {
  const rng = mulberry32(hashStr("stock|" + bid + "|" + gf));
  const g = GOOD_BY_FILE[gf];
  return Math.round(40 + rng() * 260 * (60 / Math.max(1, g.price)));
}
function goodPrice(bid, gf) {
  const g = GOOD_BY_FILE[gf];
  const st = ECON.stock[bid] && ECON.stock[bid][gf] !== undefined ? ECON.stock[bid][gf] : baseStock0(bid, gf);
  const s0 = baseStock0(bid, gf);
  const day = Math.floor(GAME.t / DAY_SEC);
  let m = marketMult0(bid, gf, day);
  m *= clamp(1 + 0.35 * (s0 - st) / s0, 0.6, 1.6);
  return Math.max(1, Math.round(g.price * m));
}
const ECON = { stock: {}, day: 0 };
function econInit() {
  for (const s of VS_DATA.systems) for (const b of s.bases) {
    const bid = baseId(s.name, b.name);
    ECON.stock[bid] = {};
    for (const g of VS_DATA.goods) ECON.stock[bid][g.file] = baseStock0(bid, g.file);
  }
}
function econTick(dt) {
  for (const bid in ECON.stock) {
    const row = ECON.stock[bid];
    for (const gf in row) {
      const s0 = baseStock0(bid, gf);
      row[gf] += (s0 - row[gf]) * 0.008 * dt;
    }
  }
}
function baseSellsContraband(bid) {
  const b = findBase(bid);
  return b && b.type === "pirate_base";
}

/* ---------- ship configs ---------- */
function shipCfg(type) {
  const s = SHIP_BY_NAME[type];
  return {
    type, desc: s.desc, role: s.role,
    mass: s.mass, hullMax: s.hull, fuelMax: Math.max(25, s.fuel * 20),
    holdMax: (type === "Llama.begin" || type === "Llama") ? 20000 :
             (type === "Mule" || type === "Hidalgo") ? 800000 : 45000,
    accel: type === "Llama.begin" || type === "Llama" ? 0.55 :
           type === "Quicksilver" ? 0.95 :
           type === "Dostoevsky" ? 0.75 :
           type === "Admonisher" ? 0.85 : 0.35,
    turn: RAD(100),
    price: s.price,
  };
}
function gunDmg(file) {
  const p = { "laser":8, "Ion_Burster":12, "Micro_Driver":14, "Mini_Driver":16,
              "Disruptor":22, "Pugilist":26 }[file] || 8;
  return p;
}
function gunRof(file) { return 2.2; } // shots/s

/* ---------- game state ---------- */
const GAME = {
  t: 0, system: "newconstantinople",
  ship: null,            // player
  npcs: [], projectiles: [],
  target: null,          // npc id or "base:<bid>" or "jump:<idx>"
  docked: null,          // bid while docked
  missions: [], missionLog: [],
  msg: "", msgT: 0,
  paused: false, view: "chase", over: null, started: false,
};
function simMsg(m) { GAME.msg = m; GAME.msgT = 4.5; }

/* ---------- player ship ---------- */
function newShip(type, sys, pos) {
  const cfg = shipCfg(type);
  return {
    player: true, id: "player", name: "your vessel", faction: "merchant_guild",
    type, cfg,
    pos: V.clone(pos), vel: [0,0,0],
    fwd: [0.8,0.2,0.4], up: [0,0,1],
    hull: cfg.hullMax, hullMax: cfg.hullMax,
    shield: 100, shieldMax: 100,
    fuel: cfg.fuelMax * 0.75,
    gun: "laser", armorLevel: 0, reactorLevel: 0, overdrive: 0, specCap: 0, cargoAdd: 0,
    assist: true, spec: false,
    cargo: {},
    cooldown: 0,
    hostileTo: {},
  };
}
function holdMax(ship) { return ship.cfg.holdMax + (ship.cargoAdd ? 60000 : 0); }
function holdUsed(ship) {
  let u = 0;
  for (const gf in ship.cargo) u += ship.cargo[gf] * GOOD_BY_FILE[gf].volume;
  return u;
}
function shieldMax(ship) { return 100 + ship.shieldLevel * 250; }
function hullMaxEff(ship) { return ship.hullMax * (1 + ship.armorLevel * 0.25); }
function thrustAccel(ship) { return ship.cfg.accel * (1 + ship.overdrive * 0.4); }

/* ---------- damage ---------- */
function applyDamage(ship, dmg) {
  if (ship.shield > 0) {
    const a = Math.min(ship.shield, dmg);
    ship.shield -= a; dmg -= a;
  }
  if (dmg > 0) ship.hull -= dmg;
  if (ship.hull <= 0) {
    ship.hull = 0;
    if (ship.player) { GAME.over = "destroyed"; }
    else { ship.dead = true; }
  }
}

/* ---------- save/load (localStorage) ---------- */
function saveGame() {
  if (GAME.docked === null) { simMsg("Save available at stations only"); return false; }
  const s = GAME.ship;
  const data = {
    v: 1, t: GAME.t, system: GAME.system, docked: GAME.docked,
    credits: PLAYER.credits,
    ship: {
      type: s.type, hull: s.hull, fuel: s.fuel, gun: s.gun,
      armorLevel: s.armorLevel, reactorLevel: s.reactorLevel, shieldLevel: s.shieldLevel,
      overdrive: s.overdrive, specCap: s.specCap, cargoAdd: s.cargoAdd,
      cargo: s.cargo, assist: s.assist,
    },
    econ: ECON.stock, missions: GAME.missions, log: GAME.missionLog.slice(-40),
  };
  try {
    localStorage.setItem("vs_web_save", JSON.stringify(data));
    simMsg("Game saved");
    sfx.beep();
    return true;
  } catch (e) { simMsg("Save failed: " + e.message); return false; }
}
function loadGame() {
  const raw = localStorage.getItem("vs_web_save");
  if (!raw) { simMsg("No saved game found"); return false; }
  try {
    const d = JSON.parse(raw);
    newGame();
    GAME.t = d.t; GAME.system = d.system; GAME.docked = d.docked;
    PLAYER.credits = d.credits;
    ECON.stock = d.econ || ECON.stock;
    GAME.missions = d.missions || []; GAME.missionLog = d.log || [];
    const s = GAME.ship;
    Object.assign(s, d.ship);
    s.cfg = shipCfg(d.ship.type);
    s.hullMax = s.cfg.hullMax;
    s.shield = shieldMax(s);
    s.pos = V.add(findBase(GAME.docked).pos ? findBase(GAME.docked).pos : [0,0,0], [3.5,0,0]);
    GAME.started = true; GAME.dockedOpen = true;
    simMsg("Game loaded - docked at " + GAME.docked.split("::")[1]);
    return true;
  } catch (e) { simMsg("Load failed: " + e.message); return false; }
}
const PLAYER = { credits: 6000 };

/* ============================================================
   Vega Strike web port - flight & combat: thrust, flight
   assist, SPEC drive, docking, jump points, projectiles, NPC AI
   ============================================================ */

const SPEC_MULT = 200;
const ASSIST_K = 0.5;        // flight-assist drag (1/s)
const DOCK_RANGE = 6;        // Mm
const DOCK_SPEED = 3;        // Mm/s
const JUMP_RANGE = 10;       // Mm

function rotateBasis(ship, axis, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  const rot = (vec) => V.add(V.add(V.scale(vec, c), V.scale(V.cross(axis, vec), s)), V.scale(axis, V.dot(axis, vec) * (1 - c)));
  ship.fwd = V.norm(rot(ship.fwd));
  const r = V.norm(V.cross(ship.fwd, ship.up));
  ship.up = V.norm(V.cross(r, ship.fwd));
  ship.right = r;
}
function ensureBasis(ship) {
  if (!ship.right) ship.right = V.norm(V.cross(ship.fwd, ship.up));
  ship.fwd = V.norm(ship.fwd);
  const r = V.norm(V.cross(ship.fwd, ship.up));
  ship.up = V.norm(V.cross(r, ship.fwd));
  ship.right = r;
}

function flyShip(ship, input, dt) {
  // input: {pitch, yaw, roll, thrust(0..1), boost}
  ensureBasis(ship);
  ship.cooldown = Math.max(0, ship.cooldown - dt);
  const rate = ship.cfg.turn * dt;
  if (input.pitch) rotateBasis(ship, ship.right, input.pitch * rate);
  if (input.yaw)   rotateBasis(ship, ship.up, -input.yaw * rate);
  if (input.roll)  rotateBasis(ship, ship.fwd, input.roll * rate);
  const T = thrustAccel(ship) * (input.boost ? 2.2 : 1) * input.thrust;
  if (T > 0) {
    ship.vel = V.add(ship.vel, V.scale(ship.fwd, T * dt));
    ship.fuel = Math.max(0, ship.fuel - 0.02 * dt * input.thrust);
  }
  if (ship.assist) {
    const k = 1 - Math.exp(-ASSIST_K * dt);
    ship.vel = V.sub(ship.vel, V.scale(ship.vel, k));
  }
  if (ship.spec && ship.fuel > 0) {
    ship.vel = V.scale(ship.vel, 1 + (SPEC_MULT - 1) * Math.min(1, dt * 3));
    ship.fuel = Math.max(0, ship.fuel - 0.25 * dt);
    if (ship.fuel <= 0) { ship.spec = false; if (ship.player) simMsg("SPEC offline - fuel exhausted"); }
  }
  ship.pos = V.add(ship.pos, V.scale(ship.vel, dt));
}

/* ---------- gunnery ---------- */
function fireGun(ship) {
  if (ship.cooldown > 0 || GAME.docked) return;
  const dmg = gunDmg(ship.gun) * (1 + (ship.reactorLevel || 0) * 0.15);
  const right = ship.right || V.cross(ship.fwd, ship.up);
  for (const off of [-0.14, 0.14]) {  // twin mounts, converged at 6 Mm
    const spawn = V.add(ship.pos, V.add(V.scale(ship.fwd, 0.15), V.scale(right, off)));
    const aim = V.add(ship.pos, V.scale(ship.fwd, 6));  // convergence point
    const dir = V.norm(V.sub(aim, spawn));
    GAME.projectiles.push({
      pos: spawn,
      vel: V.add(ship.vel, V.scale(dir, 6)),
      owner: ship.id, dmg, life: 1.2, col: ship.player ? "#7fff9f" : "#ff9f7f",
    });
  }
  ship.cooldown = 1 / gunRof(ship.gun);
  if (ship.player) sfx.zap();
}

function stepProjectiles(dt) {
  const ships = [GAME.ship, ...GAME.npcs].filter(s => s && !s.dead && !s.gone);
  for (const p of GAME.projectiles) {
    p.pos = V.add(p.pos, V.scale(p.vel, dt));
    p.life -= dt;
    for (const s of ships) {
      if (p.owner === s.id) continue;
      if (V.len(V.sub(p.pos, s.pos)) < 0.25) {
        applyDamage(s, p.dmg);
        p.life = 0;
        p.hit = s.id;
        if (p.owner === "player" && !s.player) {
          // attacking a ship makes its faction hostile to you
          s.hostileToPlayer = true;
          if (GAME.target === s.id) UI.flashTarget = 0.2;
        }
        if (s.player) { UI.hudShake = 0.25; sfx.hit(); }
        break;
      }
    }
  }
  GAME.projectiles = GAME.projectiles.filter(p => p.life > 0);
}

/* ---------- NPCs ---------- */
let NPC_SEQ = 1;
function spawnNPC(kind, sname, nearPos) {
  const rng = mulberry32((hashStr(sname) + NPC_SEQ * 7919) >>> 0);
  NPC_SEQ++;
  let type, faction, name;
  if (kind === "pirate") {
    type = rng() < 0.75 ? "Dostoevsky" : "Hidalgo";
    faction = "pirates";
    name = "raider " + (100 + Math.floor(rng() * 900));
  } else if (kind === "merchant") {
    type = rng() < 0.6 ? "Llama" : (rng() < 0.5 ? "Mule" : "Quicksilver");
    faction = rng() < 0.5 ? "merchant_guild" : "confed";
    name = faction === "confed" ? "confed patrol " + (10 + Math.floor(rng() * 90)) : "trader " + (10 + Math.floor(rng() * 900));
  } else {
    type = "Admonisher";
    faction = "confed";
    name = "confed patrol " + (10 + Math.floor(rng() * 90));
  }
  const cfg = shipCfg(type);
  const sys = SYS[sname];
  const b = sys.bases[Math.floor(rng() * sys.bases.length)];
  const pos = nearPos || V.add(b.pos, [(rng()-0.5)*40, (rng()-0.5)*40, (rng()-0.5)*40]);
  const hullMax = cfg.hullMax * (faction === "pirates" && type === "Dostoevsky" ? 0.6 : 1);
  const shieldMax = faction === "pirates" ? (type === "Hidalgo" ? 500 : 100) : (faction === "confed" ? 300 : 100);
  return {
    player: false, id: "npc" + NPC_SEQ, name, faction, type, cfg,
    pos, vel: [(rng()-0.5)*0.6, (rng()-0.5)*0.6, (rng()-0.5)*0.6],
    fwd: V.norm([(rng()-0.5), (rng()-0.5), (rng()-0.5)]), up: [0,0,1],
    hull: hullMax, hullMax, shield: shieldMax, shieldMax,
    fuel: 100, cargo: {}, cooldown: 0,
    kind, behavior: kind === "pirate" ? "hunt" : (faction === "confed" ? "patrol" : "trade"),
    hostileToPlayer: false, state: "cruise", targetPos: null, stateT: 0,
  };
}
function npcHostilesIn(sname) {
  return GAME.npcs.filter(n => !n.dead && n.kind === "pirate" && (n.hostileToPlayer || n.behavior === "hunt"));
}
function pirateDensity(sname) {
  return ["saxtogue","nd-57","rikel","44-p-im"].includes(sname) ? 3 :
         ["junction","aldebran","varnus"].includes(sname) ? 1 : 0;
}
function spawnSystemNPCs(sname) {
  GAME.npcs = [];
  GAME.projectiles = [];
  const rng = mulberry32(hashStr("npcs|" + sname + "|" + Math.floor(GAME.t / 120)));
  const np = pirateDensity(sname);
  for (let k = 0; k < np; k++) GAME.npcs.push(spawnNPC("pirate", sname));
  const merchants = 3 + Math.floor(rng() * 2);
  for (let k = 0; k < merchants; k++) GAME.npcs.push(spawnNPC("merchant", sname));
  if (pirateDensity(sname) > 1) GAME.npcs.push(spawnNPC("patrol", sname));
}

function steerToward(n, desired, dt, rateScale) {
  const cur = n.fwd;
  const dotv = clamp(V.dot(cur, desired), -1, 1);
  const ang = Math.acos(dotv);
  const step = Math.min(ang, n.cfg.turn * (rateScale || 0.5) * dt);
  if (ang > 1e-4) {
    const axis = V.norm(V.cross(cur, desired));
    rotateBasis(n, axis, step);
  }
}
function npcTick(n, dt) {
  if (n.dead) return;
  ensureBasis(n);
  n.stateT -= dt;
  n.cooldown = Math.max(0, n.cooldown - dt);
  const player = GAME.ship;
  const distP = V.len(V.sub(player.pos, n.pos));
  let desired = n.fwd, thrust = 0.85;

  if (n.behavior === "trade") {
    if (!n.targetPos || n.stateT <= 0) {
      const b = SYS[GAME.system].bases[Math.floor(Math.random() * SYS[GAME.system].bases.length)];
      n.targetPos = V.add(b.pos, [(Math.random()-0.5)*6, (Math.random()-0.5)*6, (Math.random()-0.5)*6]);
      n.stateT = 25 + Math.random() * 20;
    }
    const d = V.sub(n.targetPos, n.pos);
    if (V.len(d) < 8) { n.vel = V.scale(n.vel, 1 - Math.min(1, dt * 2)); thrust = 0.15; }
    desired = V.norm(d);
  } else if (n.behavior === "patrol") {
    // hunt pirates; otherwise cruise
    const pirates = GAME.npcs.filter(x => x.kind === "pirate" && !x.dead);
    let tgt = null, bd = 1e9;
    for (const p of pirates) {
      const d = V.len(V.sub(p.pos, n.pos));
      if (d < bd) { bd = d; tgt = p; }
    }
    if (tgt && bd < 60) {
      desired = V.norm(V.sub(tgt.pos, n.pos));
      if (bd < 5 && n.cooldown <= 0) fireGunNPC(n, tgt);
      thrust = bd > 3 ? 1 : 0.2;
    } else if (!n.targetPos || n.stateT <= 0) {
      n.targetPos = V.add(SYS[GAME.system].star ? SYS[GAME.system].star.pos || [0,0,0] : [0,0,0], [(Math.random()-0.5)*300, (Math.random()-0.5)*200, (Math.random()-0.5)*300]);
      n.stateT = 20 + Math.random() * 15;
    } else desired = V.norm(V.sub(n.targetPos, n.pos));
  } else { // pirate hunt
    if (distP < 90 && (n.hostileToPlayer || pirateHostileByDefault())) {
      desired = V.norm(V.sub(player.pos, n.pos));
      if (distP < 6.5 && n.cooldown <= 0) fireGunNPC(n, player);
      thrust = distP > 2.5 ? 1 : 0.3;
      if (distP < 1.5) desired = V.scale(V.norm(V.sub(player.pos, n.pos)), -0.3);
    } else if (!n.targetPos || n.stateT <= 0) {
      const b = SYS[GAME.system].bases[Math.floor(Math.random() * SYS[GAME.system].bases.length)];
      n.targetPos = V.add(b.pos, [(Math.random()-0.5)*50, (Math.random()-0.5)*50, (Math.random()-0.5)*50]);
      n.stateT = 18 + Math.random() * 15;
    } else desired = V.norm(V.sub(n.targetPos, n.pos));
  }
  steerToward(n, desired, dt);
  // integrate (assist-style)
  n.vel = V.add(n.vel, V.scale(n.fwd, thrust * n.cfg.accel * dt));
  n.vel = V.sub(n.vel, V.scale(n.vel, Math.min(1, ASSIST_K * dt)));
  n.pos = V.add(n.pos, V.scale(n.vel, dt));
}
function pirateHostileByDefault() {
  return GAME.npcs.filter(n => n.kind === "pirate").every(n => n.hostileToPlayer) || GAME.bountyActive === true;
}
function fireGunNPC(n, tgt) {
  const dmg = gunDmg("laser") * 0.8;
  const dir = V.norm(V.sub(tgt.pos, n.pos));
  GAME.projectiles.push({
    pos: V.add(n.pos, V.scale(dir, 0.2)),
    vel: V.add(n.vel, V.scale(dir, 5.5)),
    owner: n.id, dmg, life: 1.3, col: "#ff9f7f",
  });
  n.cooldown = 0.8;
}

/* ---------- docking & jumping ---------- */
function nearestBase() {
  const s = SYS[GAME.system];
  let best = null, bd = 1e9;
  for (const b of s.bases) {
    const d = V.len(V.sub(b.pos, GAME.ship.pos));
    if (d < bd) { bd = d; best = b; }
  }
  return { b: best, d: bd };
}
function nearestJump() {
  const s = SYS[GAME.system];
  let best = null, bd = 1e9, bi = -1;
  s.jumps.forEach((j, i) => {
    const d = V.len(V.sub(j.pos, GAME.ship.pos));
    if (d < bd) { bd = d; best = j; bi = i; }
  });
  return { j: best, d: bd, i: bi };
}
function tryDock() {
  const { b, d } = nearestBase();
  if (!b || d > DOCK_RANGE) { simMsg("No station in range (" + (b ? d.toFixed(1) : "-") + " Mm, need < " + DOCK_RANGE + ")"); return; }
  if (V.len(GAME.ship.vel) > DOCK_SPEED) { simMsg("Too fast to dock - slow to under " + DOCK_SPEED + " Mm/s"); return; }
  GAME.docked = baseId(GAME.system, b.name);
  GAME.dockedOpen = true;
  UI.dockTab = "market";
  GAME.ship.vel = [0,0,0]; GAME.ship.spec = false;
  GAME.bountyActive = false;
  // confed customs: contraband check (documented VS mechanic)
  const bid = GAME.docked;
  const hasContraband = Object.keys(GAME.ship.cargo).some(gf => gf.startsWith("Contraband/") || GOOD_BY_FILE[gf] && GOOD_BY_FILE[gf].cat.startsWith("Contraband"));
  const bfac = b.faction;
  if (hasContraband && (bfac === "confed" || bfac === "merchant_guild")) {
    let seized = 0, fines = 0;
    for (const gf in GAME.ship.cargo) {
      if (GOOD_BY_FILE[gf].cat.startsWith("Contraband")) {
        seized += GAME.ship.cargo[gf];
        fines += goodPrice(bid, gf) * GAME.ship.cargo[gf];
        delete GAME.ship.cargo[gf];
      }
    }
    PLAYER.credits = Math.max(0, PLAYER.credits - Math.round(fines * 0.5));
    simMsg("Customs: " + seized + " units of contraband seized, fined " + Math.round(fines * 0.5) + " cr");
    sfx.bad();
  } else {
    simMsg("Docked at " + b.name);
    sfx.beep();
  }
  checkMissions();
  saveGame();
}
function undock() {
  if (GAME.docked === null) return;
  const b = findBase(GAME.docked);
  GAME.docked = null; GAME.dockedOpen = false;
  GAME.ship.pos = V.add(b.pos, V.scale(V.norm([1, 0.2, 0.4]), DOCK_RANGE * 1.3));
  GAME.ship.vel = [0.6, 0.12, 0.24];
  ensureBasis(GAME.ship);
  simMsg("Undocked - good hunting");
}
function tryJump() {
  if (GAME.jumpT !== undefined) return;
  const { j, d, i } = nearestJump();
  if (!j || d > JUMP_RANGE) { simMsg("No jump point in range"); return; }
  GAME.jumpT = 0; GAME.jumpTo = j.dest;
  sfx.jump();
}
function stepJump(dt) {
  if (GAME.jumpT === undefined) return;
  GAME.jumpT += dt;
  if (GAME.jumpT > 2.5) {
    GAME.system = GAME.jumpTo;
    const dest = SYS[GAME.system];
    if (dest.jumps.length) {
      // arrive near the first jump point back
      GAME.ship.pos = V.add(dest.jumps[0].pos, [3, 1, 2]);
      GAME.ship.vel = [0.4, 0.1, 0.2];
    } else GAME.ship.pos = [0, 0, 0];
    ensureBasis(GAME.ship);
    spawnSystemNPCs(GAME.system);
    GAME.jumpT = undefined; GAME.jumpTo = null;
    simMsg("Arrived in " + GAME.system);
  }
}

/* ---------- missions ---------- */
function genMission(bid) {
  const rng = mulberry32(hashStr("miss|" + bid + "|" + Math.floor(GAME.t / 300)));
  const [sn] = bid.split("::");
  const s = SYS[sn];
  const links = [...new Set(VS_DATA.links.filter(l => l.includes(sn)).map(l => l[0] === sn ? l[1] : l[0]))];
  if (rng() < 0.6 && links.length) {
    // cargo delivery
    const legal = VS_DATA.goods.filter(g => !g.cat.startsWith("Contraband"));
    const g = legal[Math.floor(rng() * legal.length)];
    const qty = 8 + Math.floor(rng() * 25);
    const destSn = links[Math.floor(rng() * links.length)];
    const destBase = SYS[destSn].bases[Math.floor(rng() * SYS[destSn].bases.length)];
    const pay = Math.round(qty * g.price * (0.35 + rng() * 0.5) + 800);
    return { kind: "cargo", good: g.file, qty, from: bid, to: baseId(destSn, destBase.name), pay,
             title: "Cargo: " + qty + " " + g.file.replace(/_/g, " ") + " to " + destBase.name + " (" + destSn + ")",
             done: false };
  } else {
    const n = 2 + Math.floor(rng() * 3);
    const pay = n * 1500 + Math.round(rng() * 800);
    return { kind: "bounty", count: n, killed: 0, pay,
             title: "Bounty: destroy " + n + " pirates", done: false };
  }
}
function checkMissions() {
  for (const m of GAME.missions) {
    if (m.done) continue;
    if (m.kind === "cargo" && GAME.docked === m.to) {
      const have = GAME.ship.cargo[m.good] || 0;
      if (have >= m.qty) {
        GAME.ship.cargo[m.good] = have - m.qty;
        PLAYER.credits += m.pay;
        m.done = true;
        GAME.missionLog.push("Delivered " + m.qty + " x " + m.good + " - paid " + m.pay + " cr");
        simMsg("Mission complete: +" + m.pay + " cr");
        sfx.win();
      } else simMsg("Delivery needs " + m.qty + " x " + m.good + " (have " + have + ")");
    }
    if (m.kind === "bounty" && GAME.docked && m.killed >= m.count) {
      PLAYER.credits += m.pay;
      m.done = true;
      GAME.missionLog.push("Bounty fulfilled - paid " + m.pay + " cr");
      simMsg("Bounty paid: +" + m.pay + " cr");
      sfx.win();
    }
  }
  GAME.missions = GAME.missions.filter(m => !m.done || m.keep);
}

/* ============================================================
   Vega Strike web port - render: chase-cam 3D projection,
   procedural planets, vector ships, projectiles, radar, HUD
   ============================================================ */

const VIEW = { fov: 420, shake: 0 };

/* ---------- procedural planet textures ---------- */
const TEX = {};
function makeTextures() {
  const defs = {
    sun:  ["#ffd060", "sun"], earthlike: ["#4f7bd9", "earth"],
    rock: ["#a9907b", "rock"], ice: ["#cfe0ee", "rock"],
    gas:  ["#d8b48c", "gas"], dark: ["#5a6478", "rock"],
  };
  for (const s of VS_DATA.systems) {
    const list = [];
    if (s.star) list.push([s.star, "sun"]);
    for (const p of s.planets) {
      const t = p.tex.toLowerCase();
      let k = "rock";
      if (t.includes("earth") || t.includes("forest") || t.includes("m_class")) k = "earthlike";
      else if (t.includes("gas") || t.includes("jupiter") || t.includes("saturn") || t.includes("neptune") || t.includes("uranus")) k = "gas";
      else if (t.includes("ice") || t.includes("snow")) k = "ice";
      else if (t.includes("dirt") || t.includes("rock")) k = "rock";
      list.push([p, k]);
    }
    for (const [obj, k] of list) {
      const cv = document.createElement("canvas");
      cv.width = cv.height = 64;
      const c = cv.getContext("2d");
      const rng = mulberry32(hashStr(s.name + obj.name));
      c.fillStyle = defs[k][0]; c.fillRect(0, 0, 64, 64);
      if (k === "sun") {
        for (let i = 0; i < 380; i++) {
          c.fillStyle = rng() < 0.5 ? "rgba(255,230,120,0.3)" : "rgba(255,120,20,0.3)";
          c.fillRect(rng() * 64, rng() * 64, 2, 2);
        }
      } else if (k === "gas") {
        let y = 0;
        while (y < 64) {
          const h = 3 + rng() * 8;
          c.globalAlpha = 0.5 + rng() * 0.3;
          c.fillStyle = rng() < 0.5 ? "#c9a97e" : "#e8d9b8";
          c.fillRect(0, y, 64, h); y += h;
        }
        c.globalAlpha = 1;
      } else if (k === "earthlike") {
        for (let i = 0; i < 12; i++) {
          c.fillStyle = "#3f9e44";
          c.beginPath();
          c.ellipse(rng() * 64, rng() * 64, 3 + rng() * 10, 2 + rng() * 6, rng() * 3, 0, 7);
          c.fill();
        }
        for (let i = 0; i < 10; i++) {
          c.fillStyle = "rgba(255,255,255,0.5)";
          c.beginPath();
          c.ellipse(rng() * 64, rng() * 64, 4 + rng() * 8, 2 + rng() * 2, 0, 0, 7);
          c.fill();
        }
      } else {
        for (let i = 0; i < 45; i++) {
          const x = rng() * 64, y = rng() * 64, rr = 1 + rng() * 3.4;
          c.fillStyle = "rgba(30,25,20,0.4)";
          c.beginPath(); c.arc(x, y, rr, 0, 7); c.fill();
        }
      }
      TEX[s.name + "/" + obj.name] = cv;
    }
  }
}

/* ---------- projection ---------- */
const CAM = { pos: [0,0,0], fwd: [1,0,0], up: [0,0,1], right: [0,1,0] };
function project(p, cx, cy, vw, vh) {
  const rel = V.sub(p, CAM.pos);
  const z = V.dot(rel, CAM.fwd);
  if (z <= 0.2) return null;
  const x = V.dot(rel, CAM.right), y = V.dot(rel, CAM.up);
  return { x: cx + VIEW.fov * x / z, y: cy - VIEW.fov * y / z, z, sx: VIEW.fov / z };
}

/* ---------- starfield ---------- */
const STARS = [];
function makeStars() {
  const rng = mulberry32(42);
  for (let k = 0; k < 520; k++) {
    const z = rng() * 2 - 1, th = rng() * Math.PI * 2, rr = Math.sqrt(1 - z * z);
    STARS.push({ d: [rr * Math.cos(th), rr * Math.sin(th), z], m: rng() });
  }
}

/* ---------- ship sprite drawing ---------- */
const SHIP_SHAPES = {
  Llama:      [[0,-0.6],[0.35,0.15],[0.12,0.5],[-0.12,0.5],[-0.35,0.15]],
  Dostoevsky: [[0,-0.7],[0.3,-0.2],[0.42,0.35],[0,0.6],[-0.42,0.35],[-0.3,-0.2]],
  Mule:       [[-0.5,-0.5],[0.5,-0.5],[0.5,0.35],[0.2,0.5],[-0.2,0.5],[-0.5,0.35]],
  Quicksilver:[[0,-0.75],[0.22,0.2],[0.08,0.55],[-0.08,0.55],[-0.22,0.2]],
  Admonisher: [[0,-0.75],[0.28,-0.3],[0.55,0.1],[0.3,0.55],[-0.3,0.55],[-0.55,0.1],[-0.28,-0.3]],
  Hidalgo:    [[0,-0.65],[0.5,-0.1],[0.5,0.4],[-0.5,0.4],[-0.5,-0.1]],
};
const FAC_COLOR = {
  pirates: "#ff6a5a", confed: "#7fa8ff", merchant_guild: "#7fffd4",
  merchants: "#7fffd4", LIHW: "#ffd47f", ISO: "#e07fff",
};
function facCol(f) { return FAC_COLOR[f] || "#c8c8d4"; }

function drawShipSprite(ctx, ship, X, Y, px, col) {
  const shape = SHIP_SHAPES[ship.type] || SHIP_SHAPES.Llama;
  // orient by projecting fwd/right onto screen plane
  const fw = V.sub(ship.fwd, V.scale(CAM.fwd, V.dot(ship.fwd, CAM.fwd)));
  const rt = V.sub(ship.right || V.cross(ship.fwd, ship.up), V.scale(CAM.fwd, V.dot(ship.right || [0,1,0], CAM.fwd)));
  let ang = 0;
  if (V.len(fw) > 1e-5) ang = Math.atan2(V.dot(fw, CAM.up), V.dot(fw, CAM.right));
  else if (V.len(rt) > 1e-5) ang = Math.atan2(V.dot(rt, CAM.up), V.dot(rt, CAM.right)) + Math.PI / 2;
  ctx.save();
  ctx.translate(X, Y);
  ctx.rotate(ang);
  const s = Math.max(4, px);
  ctx.strokeStyle = col; ctx.lineWidth = 1.4;
  ctx.beginPath();
  shape.forEach((pt, i) => {
    const pxp = pt[0] * s, pyp = -pt[1] * s;
    if (i === 0) ctx.moveTo(pxp, pyp); else ctx.lineTo(pxp, pyp);
  });
  ctx.closePath(); ctx.stroke();
  if (ship.player) { ctx.fillStyle = "rgba(127,255,159,0.25)"; ctx.fill(); }
  ctx.restore();
}

/* ---------- main scene render ---------- */
function renderScene(cx, cy, vw, vh) {
  ctx.fillStyle = "#020208";
  ctx.fillRect(0, 0, vw, vh);
  const ship = GAME.ship;
  // camera
  const shake = UI.hudShake > 0 ? (Math.random()-0.5) * 6 * UI.hudShake : 0;
  const camBack = 2.2, camUp = 0.7;
  CAM.pos = V.sub(ship.pos, V.scale(ship.fwd, camBack));
  CAM.pos = V.add(CAM.pos, V.scale(ship.up, camUp));
  CAM.fwd = ship.fwd; CAM.up = ship.up; CAM.right = ship.right;
  // stars
  for (const st of STARS) {
    const dz = V.dot(st.d, CAM.fwd);
    if (dz < 0.06) continue;
    const X = cx + VIEW.fov * (V.dot(st.d, CAM.right) / dz) + shake;
    const Y = cy - VIEW.fov * (V.dot(st.d, CAM.up) / dz) + shake;
    if (X < 0 || X > vw || Y < 0 || Y > vh) continue;
    ctx.globalAlpha = 0.3 + st.m * 0.7;
    ctx.fillStyle = "#dfe4ff";
    ctx.fillRect(X, Y, st.m > 0.85 ? 2 : 1, st.m > 0.85 ? 2 : 1);
  }
  ctx.globalAlpha = 1;
  const sys = SYS[GAME.system];
  const drawList = [];
  if (sys.star) drawList.push({ kind: "planet", obj: sys.star });
  for (const p of sys.planets) drawList.push({ kind: "planet", obj: p });
  for (const b of sys.bases) drawList.push({ kind: "base", obj: b });
  for (const j of sys.jumps) drawList.push({ kind: "jump", obj: j });
  for (const n of GAME.npcs) if (!n.dead) drawList.push({ kind: "ship", obj: n });
  for (const p of GAME.projectiles) drawList.push({ kind: "proj", obj: p });
  // depth sort
  for (const d of drawList) d.z = V.dot(V.sub(d.obj.pos, CAM.pos), CAM.fwd);
  drawList.sort((a, b) => b.z - a.z);

  for (const d of drawList) {
    const pr = project(d.obj.pos, cx, cy, vw, vh);
    if (!pr) continue;
    if (d.kind === "planet") {
      const o = d.obj;
      const px = Math.max(2, o.r * pr.sx);
      if (pr.x < -px || pr.x > vw + px || pr.y < -px || pr.y > vh + px) continue;
      const tex = TEX[GAME.system + "/" + o.name];
      ctx.save();
      ctx.beginPath(); ctx.arc(pr.x, pr.y, px, 0, 7); ctx.clip();
      if (px < 6 || !tex) {
        ctx.fillStyle = o === sys.star ? "#ffd060" : "#8898b8";
        ctx.fillRect(pr.x - px, pr.y - px, px * 2, px * 2);
      } else ctx.drawImage(tex, pr.x - px, pr.y - px, px * 2, px * 2);
      // shading toward star
      const sunDir = sys.star ? V.norm(V.sub(o.pos, sys.star.pos)) : [1,0,0];
      const lx = V.dot(sunDir, CAM.right), ly = V.dot(sunDir, CAM.up);
      const g = ctx.createRadialGradient(pr.x - lx * px * 0.9, pr.y + ly * px * 0.9, px * 0.15, pr.x, pr.y, px * 1.5);
      g.addColorStop(0, "rgba(255,255,255,0.16)");
      g.addColorStop(0.5, "rgba(0,0,0,0)");
      g.addColorStop(1, "rgba(0,0,8,0.9)");
      ctx.fillStyle = g; ctx.fillRect(pr.x - px, pr.y - px, px * 2 + 1, px * 2 + 1);
      ctx.restore();
      if (px > 14) {
        ctx.fillStyle = "#8a93b8"; ctx.font = "10px 'Lucida Console', monospace";
        ctx.fillText(o.name, pr.x + px + 4, pr.y + 3);
      }
    } else if (d.kind === "base") {
      const px = Math.max(3, 0.5 * pr.sx);
      ctx.strokeStyle = "#c8d4e8"; ctx.lineWidth = 1.2;
      ctx.strokeRect(pr.x - px, pr.y - px, px * 2, px * 2);
      ctx.beginPath(); ctx.moveTo(pr.x - px, pr.y); ctx.lineTo(pr.x + px, pr.y);
      ctx.moveTo(pr.x, pr.y - px); ctx.lineTo(pr.x, pr.y + px); ctx.stroke();
      if (px > 8 || d.z < 20) {
        ctx.fillStyle = facCol(d.obj.faction);
        ctx.font = "10px 'Lucida Console', monospace";
        ctx.fillText(d.obj.name, pr.x + px + 3, pr.y + 3);
      }
    } else if (d.kind === "jump") {
      const px = Math.max(3, 0.6 * pr.sx);
      ctx.strokeStyle = "#c07fff"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, px, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(pr.x, pr.y, px * 0.5, 0, 7); ctx.stroke();
      if (d.z < 40) {
        ctx.fillStyle = "#c07fff"; ctx.font = "10px 'Lucida Console', monospace";
        ctx.fillText("jump: " + d.obj.dest.split("/")[1], pr.x + px + 3, pr.y + 3);
      }
    } else if (d.kind === "ship") {
      const n = d.obj;
      const px = clamp(1.1 * pr.sx, 3, 26);
      drawShipSprite(ctx, n, pr.x, pr.y, px, facCol(n.faction));
      if (GAME.target === n.id) {
        ctx.strokeStyle = "#ffb400"; ctx.lineWidth = 1;
        const r = px + 6;
        ctx.beginPath();
        ctx.moveTo(pr.x - r, pr.y - r + 4); ctx.lineTo(pr.x - r, pr.y - r); ctx.lineTo(pr.x - r + 4, pr.y - r);
        ctx.moveTo(pr.x + r - 4, pr.y - r); ctx.lineTo(pr.x + r, pr.y - r); ctx.lineTo(pr.x + r, pr.y - r + 4);
        ctx.moveTo(pr.x + r, pr.y + r - 4); ctx.lineTo(pr.x + r, pr.y + r); ctx.lineTo(pr.x + r - 4, pr.y + r);
        ctx.moveTo(pr.x - r + 4, pr.y + r); ctx.lineTo(pr.x - r, pr.y + r); ctx.lineTo(pr.x - r, pr.y + r - 4);
        ctx.stroke();
      }
      if (d.z < 30) {
        ctx.fillStyle = facCol(n.faction); ctx.font = "9px 'Lucida Console', monospace";
        ctx.fillText(n.name + " " + d.z.toFixed(1) + " Mm", pr.x + px + 3, pr.y - 3);
      }
    } else if (d.kind === "proj") {
      ctx.fillStyle = d.obj.col;
      ctx.fillRect(pr.x - 1.5, pr.y - 1.5, 3, 3);
    }
  }

  // crosshair + lead reticle for targeted ship
  const tgt = GAME.npcs.find(n => n.id === GAME.target);
  if (tgt && !tgt.dead) {
    const rel = V.sub(tgt.pos, ship.pos);
    const closing = V.len(V.sub(tgt.vel, ship.vel));
    const t = V.len(rel) / 6;
    const lead = V.add(tgt.pos, V.scale(V.sub(tgt.vel, ship.vel), t));
    const prl = project(lead, cx, cy, vw, vh);
    if (prl) {
      ctx.strokeStyle = "#ffb400";
      ctx.beginPath(); ctx.arc(prl.x, prl.y, 4, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(prl.x - 7, prl.y); ctx.lineTo(prl.x - 3, prl.y);
      ctx.moveTo(prl.x + 3, prl.y); ctx.lineTo(prl.x + 7, prl.y); ctx.stroke();
    }
  }
}

/* ---------- radar ---------- */
function renderRadar(cx, cy, R) {
  ctx.strokeStyle = "#28304a"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.55, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
  ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
  const ship = GAME.ship;
  const blip = (pos, col, kind) => {
    const rel = V.sub(pos, ship.pos);
    let z = V.dot(rel, ship.fwd);
    const x = V.dot(rel, ship.right), y = V.dot(rel, ship.up);
    const rng = 160;
    const k = R / rng;
    const front = z >= 0;
    if (Math.abs(z) > rng || Math.abs(x) > rng || Math.abs(y) > rng) {
      const mx = Math.max(Math.abs(z), Math.abs(x), Math.abs(y)) / rng;
      z /= mx; var xx = x / mx; var yy = y / mx;
    } else { var xx = x, yy = y; }
    const bx = cx + xx * k, by = cy - yy * k;
    ctx.fillStyle = col;
    if (!front) {
      ctx.strokeStyle = col;
      ctx.strokeRect(bx - 1.5, by - 1.5, 3, 3);
    } else ctx.fillRect(bx - 1.5, by - 1.5, 3, 3);
  };
  for (const n of GAME.npcs) if (!n.dead) blip(n.pos, facCol(n.faction), "ship");
  const sys = SYS[GAME.system];
  for (const b of sys.bases) blip(b.pos, "#c8d4e8", "base");
  for (const j of sys.jumps) blip(j.pos, "#c07fff", "jump");
  if (sys.star) blip(sys.star.pos, "#ffd060", "sun");
  for (const p of sys.planets) blip(p.pos, "#8898b8", "planet");
}

/* ============================================================
   Vega Strike web port - UI: flight HUD, station dialogs
   (market / shipyard / missions), galaxy map, help
   ============================================================ */

const UI = { hits: [], hover: null, dockTab: "market", marketScroll: 0, boardScroll: 0,
             hudShake: 0, flashTarget: 0, mapOpen: false, helpOpen: false, aboutOpen: false };

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

function fmtCr(n) {
  n = Math.round(n);
  return n.toLocaleString("en-US");
}
function fmtDist(km) {
  if (km < 1e4) return km.toFixed(0) + " km";
  return (km / 1000).toFixed(1) + " Mm";
}
function goodName(gf) { return gf.split("/").pop().replace(/_/g, " "); }

function btn(x, y, w, h, label, cb, opts = {}) {
  const hov = UI.hover && UI.hover.x === x && UI.hover.y === y;
  ctx.fillStyle = opts.dark ? (hov ? "#2c3454" : "#1a2038") : (hov ? "#2e3654" : "#20263e");
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = opts.active ? "#ffb400" : (opts.dark ? "#3a4468" : "#4a5478");
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.fillStyle = opts.active ? "#ffb400" : opts.col || "#c8d0e8";
  ctx.font = (opts.big ? "bold 12" : "11") + "px 'Lucida Console', monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2 + 0.5);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  UI.hits.push({ x, y, w, h, cb });
}

/* ---------- flight HUD ---------- */
function renderHUD(vw, vh) {
  const s = GAME.ship;
  const spd = V.len(s.vel) * 1000; // km/s
  ctx.font = "11px 'Lucida Console', monospace";
  // top-left: credits, cargo, fuel
  ctx.fillStyle = "#9aa4c0";
  ctx.fillText("CREDITS  " + fmtCr(PLAYER.credits), 12, 20);
  ctx.fillText("CARGO    " + Math.round(holdUsed(s)).toLocaleString("en-US") + " / " + holdMax(s).toLocaleString("en-US") + " L", 12, 34);
  ctx.fillText("FUEL     " + s.fuel.toFixed(1) + " / " + s.cfg.fuelMax.toFixed(0), 12, 48);
  ctx.fillText("SYSTEM   " + GAME.system, 12, 62);
  // hull/shield bars
  bar(12, 70, 130, 7, s.hull / hullMaxEff(s), s.hull / hullMaxEff(s) < 0.3 ? "#e04030" : "#00b000");
  bar(12, 80, 130, 7, s.shield / shieldMax(s), "#3f7fe0");
  // speed + assist + spec
  ctx.fillStyle = "#e8ecff";
  ctx.fillText(spd.toFixed(0) + " km/s" + (s.spec ? "  [SPEC x" + SPEC_MULT + "]" : "") + (s.assist ? "" : "  [NEWTONIAN]"), 12, vh - 12);
  // hint
  ctx.fillStyle = "#5a6488";
  ctx.fillText("W/S throttle \u00b7 arrows turn \u00b7 Q/E roll \u00b7 F fire \u00b7 T target enemy \u00b7 V spec \u00b7 N assist \u00b7 D dock \u00b7 J jump \u00b7 M map \u00b7 H help", 12, vh - 26);
  // message
  if (GAME.msgT > 0) {
    ctx.fillStyle = "#ffe27f"; ctx.font = "bold 13px 'Lucida Console', monospace";
    ctx.textAlign = "center";
    ctx.fillText(GAME.msg, vw / 2, 108);
    ctx.textAlign = "left";
  }
  // dock/jump prompts
  const { b, d } = nearestBase();
  if (b && d < DOCK_RANGE * 2) {
    ctx.fillStyle = d < DOCK_RANGE && V.len(s.vel) < DOCK_SPEED ? "#7fff9f" : "#c8d0e8";
    ctx.font = "bold 12px 'Lucida Console', monospace";
    ctx.textAlign = "center";
    ctx.fillText((d < DOCK_RANGE && V.len(s.vel) < DOCK_SPEED ? "[D] DOCK " : "") + b.name + "  " + fmtDist(d * 1000), vw / 2, vh / 2 + 90);
    ctx.textAlign = "left";
  }
  const { j, d: jd } = nearestJump();
  if (j && jd < JUMP_RANGE * 2) {
    ctx.fillStyle = jd < JUMP_RANGE ? "#c07fff" : "#8a93b8";
    ctx.font = "bold 12px 'Lucida Console', monospace";
    ctx.textAlign = "center";
    ctx.fillText((jd < JUMP_RANGE ? "[J] JUMP -> " : "jump point: ") + j.dest.split("/")[1] + "  " + fmtDist(jd * 1000), vw / 2, vh / 2 + 106);
    ctx.textAlign = "left";
  }
  // target panel top-right
  const tgt = GAME.npcs.find(n => n.id === GAME.target);
  if (tgt && !tgt.dead) {
    const x = vw - 190;
    ctx.fillStyle = facCol(tgt.faction); ctx.font = "bold 12px 'Lucida Console', monospace";
    ctx.fillText(tgt.name, x, 20);
    ctx.fillStyle = "#8a93b8"; ctx.font = "11px 'Lucida Console', monospace";
    ctx.fillText(tgt.faction + " / " + tgt.type, x, 34);
    const dist = fmtDist(V.len(V.sub(tgt.pos, s.pos)) * 1000);
    ctx.fillText(dist, x, 48);
    bar(x, 54, 170, 6, tgt.shield / tgt.shieldMax, "#3f7fe0");
    bar(x, 62, 170, 6, tgt.hull / tgt.hullMax, "#e04030");
  }
  // radar bottom-left
  renderRadar(70, vh - 90, 58);
  // jump tunnel overlay
  if (GAME.jumpT !== undefined) {
    ctx.fillStyle = "rgba(90,40,140,0.35)";
    ctx.fillRect(0, 0, vw, vh);
    ctx.fillStyle = "#e8d4ff"; ctx.font = "bold 16px 'Lucida Console', monospace";
    ctx.textAlign = "center";
    ctx.fillText("JUMPING TO " + GAME.jumpTo.toUpperCase(), vw / 2, vh / 2);
    ctx.textAlign = "left";
  }
}
function bar(x, y, w, h, frac, col) {
  frac = clamp(frac, 0, 1);
  ctx.fillStyle = "#20263e"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x + 1, y + 1, (w - 2) * frac, h - 2);
  ctx.strokeStyle = "#3a4468"; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

/* ---------- station dialog ---------- */

function renderMarket(x, y, w, h, bid, b) {
  const s = GAME.ship;
  ctx.font = "11px 'Lucida Console', monospace";
  ctx.fillStyle = "#5a6488";
  ctx.fillText("GOOD" + " ".repeat(26) + "PRICE      STOCK     CARGO        BUY     SELL", x, y + 4);
  const goods = VS_DATA.goods.filter(g => !g.cat.startsWith("Contraband") || baseSellsContraband(bid));
  const rowH = 17, vis = Math.floor((h - 24) / rowH);
  UI.marketScroll = clamp(UI.marketScroll, 0, Math.max(0, goods.length - vis));
  let yy = y + 20;
  for (let k = UI.marketScroll; k < Math.min(goods.length, UI.marketScroll + vis); k++) {
    const g = goods[k];
    const price = goodPrice(bid, g.file);
    const stock = ECON.stock[bid][g.file];
    const have = s.cargo[g.file] || 0;
    const y0 = yy - 10;
    if (k % 2 === 0) { ctx.fillStyle = "rgba(40,48,80,0.35)"; ctx.fillRect(x, y0, w, rowH); }
    ctx.fillStyle = g.cat.startsWith("Contraband") ? "#ff9f7f" : "#c8d0e8";
    ctx.fillText(goodName(g.file).slice(0, 26), x, yy);
    ctx.fillStyle = "#7fff9f";
    ctx.fillText(String(price).padStart(7), x + 210, yy);
    ctx.fillStyle = "#8a93b8";
    ctx.fillText(String(Math.round(stock)).padStart(6), x + 296, yy);
    ctx.fillStyle = have > 0 ? "#ffb400" : "#5a6488";
    ctx.fillText(String(have).padStart(6), x + 380, yy);
    const canBuy = PLAYER.credits >= price && holdUsed(s) + g.volume <= holdMax(s) && stock > 0;
    btn(x + w - 116, y0 + 2, 52, 13, "BUY", () => trade(bid, g.file, 1, price), { dark: true, col: canBuy ? "#7fff9f" : "#5a6488" });
    btn(x + w - 58, y0 + 2, 52, 13, "SELL", () => trade(bid, g.file, -1, price), { dark: true, col: have > 0 ? "#ffb400" : "#5a6488" });
    yy += rowH;
  }
  // scroll buttons + buy/sell 10
  btn(x, y + h - 18, 60, 14, "\u25b2 UP", () => { UI.marketScroll -= 5; }, { dark: true });
  btn(x + 66, y + h - 18, 60, 14, "\u25bc DOWN", () => { UI.marketScroll += 5; }, { dark: true });
  ctx.fillStyle = "#5a6488";
  ctx.fillText("hold volume " + (holdUsed(s)/1000).toFixed(1) + "k / " + (holdMax(s)/1000).toFixed(0) + " L \u00b7 prices respond to stock (buy up = dearer, dump = cheaper)", x + 140, y + h - 7);
}

function trade(bid, gf, dir, price) {
  const s = GAME.ship;
  if (dir > 0) {
    const g = GOOD_BY_FILE[gf];
    const space = Math.floor((holdMax(s) - holdUsed(s)) / g.volume);
    const afford = Math.floor(PLAYER.credits / price);
    const stock = ECON.stock[bid][gf];
    const qty = Math.min(1, space, afford, stock);
    if (qty <= 0) { simMsg(space <= 0 ? "Cargo hold full" : afford <= 0 ? "Not enough credits" : "No stock"); return; }
    s.cargo[gf] = (s.cargo[gf] || 0) + qty;
    PLAYER.credits -= price * qty;
    ECON.stock[bid][gf] -= qty;
    sfx.beep();
  } else {
    const have = s.cargo[gf] || 0;
    if (have <= 0) { simMsg("Nothing to sell"); return; }
    s.cargo[gf] -= 1;
    if (s.cargo[gf] <= 0) delete s.cargo[gf];
    PLAYER.credits += price;
    ECON.stock[bid][gf] += 1;
    sfx.beep();
  }
}

function renderShipyard(x, y, w, h, bid) {
  ctx.font = "11px 'Lucida Console', monospace";
  ctx.fillStyle = "#5a6488";
  ctx.fillText("UPGRADE" + " ".repeat(21) + "EFFECT       PRICE       INSTALL", x, y + 4);
  const s = GAME.ship;
  const effect = (p) => {
    switch (p.kind) {
      case "gun": return "+" + gunDmg(p.file) + " dmg/gun";
      case "shield": return "+250 shield";
      case "armor": return "+25% hull";
      case "reactor": return "+15% dmg, +regen";
      case "engine": return "+40% thrust";
      case "spec": return "+25 SPEC fuel cap";
      case "cargo": return "+60000 L hold";
    }
  };
  const parts = VS_DATA.parts;
  const rowH = 20, vis = Math.floor((h - 30) / rowH);
  UI.marketScroll = clamp(UI.marketScroll, 0, Math.max(0, parts.length - vis));
  let yy = y + 20;
  for (let k = UI.marketScroll; k < Math.min(parts.length, UI.marketScroll + vis); k++) {
    const p = parts[k];
    const y0 = yy - 12;
    if (k % 2 === 0) { ctx.fillStyle = "rgba(40,48,80,0.35)"; ctx.fillRect(x, y0, w, rowH); }
    ctx.fillStyle = "#c8d0e8";
    ctx.fillText(p.file.replace(/_/g, " ").slice(0, 28), x, yy);
    ctx.fillStyle = "#7fbfff";
    ctx.fillText(effect(p), x + 220, yy);
    ctx.fillStyle = "#7fff9f";
    ctx.fillText(fmtCr(p.price), x + 370, yy);
    const owned = (p.kind === "gun" && s.gun === p.file) ||
      (p.kind === "shield" && s.shieldLevel >= k + 1) ||
      (p.kind === "armor" && s.armorLevel >= k + 1) ||
      (p.kind === "reactor" && s.reactorLevel >= k + 1) ||
      (p.kind === "engine" && s.overdrive >= k + 1) ||
      (p.kind === "spec" && s.specCap >= k + 1) ||
      (p.kind === "cargo" && s.cargoAdd > 0);
    btn(x + w - 80, y0 + 3, 72, 14, owned ? "OWNED" : "INSTALL",
        () => buyPart(p, k, bid), { dark: true, active: !owned, col: owned ? "#5a6488" : "#7fff9f" });
    yy += rowH;
  }
  btn(x, y + h - 18, 60, 14, "\u25b2 UP", () => { UI.marketScroll -= 5; }, { dark: true });
  btn(x + 66, y + h - 18, 60, 14, "\u25bc DOWN", () => { UI.marketScroll += 5; }, { dark: true });
  // repair + refuel line
  const repCost = Math.ceil((hullMaxEff(s) - s.hull) * 4);
  const fuelNeed = Math.ceil(s.cfg.fuelMax * (1 + s.specCap * 0.5) - s.fuel);
  const refuelCost = Math.ceil(fuelNeed * 5);
  btn(x + 140, y + h - 20, 150, 16, "REPAIR (" + fmtCr(repCost) + " cr)", () => {
    const c = Math.min(repCost, PLAYER.credits);
    PLAYER.credits -= Math.ceil((hullMaxEff(s) - s.hull) * 4);
    s.hull = hullMaxEff(s);
    simMsg("Hull repaired"); sfx.beep();
  }, { dark: true, col: repCost > 0 && PLAYER.credits >= repCost ? "#7fff9f" : "#5a6488" });
  btn(x + 300, y + h - 20, 160, 16, "REFUEL (" + fmtCr(refuelCost) + " cr)", () => {
    PLAYER.credits -= refuelCost;
    s.fuel = s.cfg.fuelMax * (1 + s.specCap * 0.5);
    simMsg("Tanks topped up"); sfx.beep();
  }, { dark: true, col: refuelCost > 0 && PLAYER.credits >= refuelCost ? "#7fff9f" : "#5a6488" });
}

function buyPart(p, k, bid) {
  const s = GAME.ship;
  if (PLAYER.credits < p.price) { simMsg("Not enough credits"); sfx.bad(); return; }
  PLAYER.credits -= p.price;
  switch (p.kind) {
    case "gun": s.gun = p.file; break;
    case "shield": s.shieldLevel = k + 1; s.shield = shieldMax(s); break;
    case "armor": s.armorLevel = k + 1; break;
    case "reactor": s.reactorLevel = k + 1; break;
    case "engine": s.overdrive = k + 1; break;
    case "spec": s.specCap = k + 1; break;
    case "cargo": s.cargoAdd = 1; break;
  }
  simMsg(p.file.replace(/_/g, " ") + " installed");
  sfx.win();
}

function renderBoard(x, y, w, h, bid) {
  ctx.font = "11px 'Lucida Console', monospace";
  // active missions
  let yy = y + 4;
  ctx.fillStyle = "#ffb400"; ctx.font = "bold 11px 'Lucida Console', monospace";
  ctx.fillText("ACTIVE MISSIONS", x, yy); yy += 16;
  ctx.font = "11px 'Lucida Console', monospace";
  const active = GAME.missions.filter(m => !m.done);
  if (!active.length) { ctx.fillStyle = "#5a6488"; ctx.fillText("none - accept work below", x, yy); yy += 16; }
  for (const m of active) {
    ctx.fillStyle = "#c8d0e8";
    ctx.fillText((m.kind === "bounty" ? "[" + m.killed + "/" + m.count + "] " : "") + m.title, x, yy);
    ctx.fillStyle = "#7fff9f";
    ctx.fillText(fmtCr(m.pay) + " cr", x + w - 90, yy);
    yy += 15;
  }
  yy += 8;
  ctx.fillStyle = "#ffb400"; ctx.font = "bold 11px 'Lucida Console', monospace";
  ctx.fillText("AVAILABLE WORK", x, yy); yy += 16;
  ctx.font = "11px 'Lucida Console', monospace";
  if (!GAME.boardCache || GAME.boardCache.bid !== bid) {
    GAME.boardCache = { bid, offers: [genMission(bid), genMission(bid + "|" + Math.floor(GAME.t)), genMission(bid + "||" + Math.floor(GAME.t))] };
  }
  for (const m of GAME.boardCache.offers) {
    ctx.fillStyle = "#c8d0e8";
    ctx.fillText(m.title.slice(0, 66), x, yy);
    ctx.fillStyle = "#7fff9f";
    ctx.fillText(fmtCr(m.pay) + " cr", x + w - 90, yy);
    btn(x + w - 160, yy - 12, 64, 15, "ACCEPT", () => {
      if (GAME.missions.filter(m2 => !m2.done).length >= 2) { simMsg("Mission computer: max 2 active jobs"); return; }
      GAME.missions.push(m);
      if (m.kind === "bounty") GAME.bountyActive = true;
      GAME.boardCache.offers = GAME.boardCache.offers.filter(o => o !== m);
      simMsg("Mission accepted"); sfx.beep();
    }, { dark: true, active: true });
    yy += 22;
  }
  yy += 6;
  ctx.fillStyle = "#5a6488";
  ctx.fillText("cargo jobs: be at the destination station with the goods loaded \u00b7 bounties: kill pirates, then dock anywhere", x, yy);
}

}

/* ============================================================
   Vega Strike web port - boot: input, audio, main loop,
   new game, self-test, help
   ============================================================ */

/* ---------- audio ---------- */
const SOUND = { on: true, ac: null, engGain: null };
function audioCtx() {
  if (!SOUND.on) return null;
  if (!SOUND.ac) {
    try { SOUND.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (SOUND.ac.state === "suspended") SOUND.ac.resume();
  return SOUND.ac;
}
function blip(freq, dur, vol, type, slideTo) {
  const ac = audioCtx(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, ac.currentTime + dur / 1000);
  g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur / 1000);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur / 1000 + 0.02);
}
function startEngLoop() {
  const ac = audioCtx();
  if (!ac || SOUND.engGain) return;
  const len = ac.sampleRate * 2;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const dd = buf.getChannelData(0);
  for (let k = 0; k < len; k++) dd[k] = (Math.random() * 2 - 1) * 0.5;
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 140;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(lp).connect(g).connect(ac.destination);
  src.start();
  SOUND.engGain = g;
}
const sfx = {
  beep:  () => blip(660, 40, 0.04),
  bad:   () => blip(180, 150, 0.06, "sawtooth"),
  zap:   () => blip(940, 60, 0.05, "square", 240),
  hit:   () => blip(140, 120, 0.08, "sawtooth"),
  jump:  () => { blip(200, 500, 0.07, "sine", 1400); },
  win:   () => [523, 659, 784].forEach((f, i) => setTimeout(() => blip(f, 100, 0.06), i * 90)),
  update(dt) {
    const ac = audioCtx();
    if (!ac) return;
    startEngLoop();
    const want = (!GAME.docked && GAME.started && !UI.mapOpen && GAME.ship && GAME.ship.fuel > 0)
      ? 0.03 + 0.05 * (GAME.input ? GAME.input.thrust : 0) : 0;
    if (SOUND.engGain) SOUND.engGain.gain.value += (want - SOUND.engGain.gain.value) * Math.min(1, dt * 6);
  },
};

/* ---------- new game ---------- */
function newGame() {
  GAME.t = 0;
  GAME.system = "newconstantinople";
  GAME.docked = null; GAME.dockedOpen = false;
  GAME.missions = []; GAME.missionLog = [];
  GAME.over = null; GAME.jumpT = undefined; GAME.jumpTo = null;
  GAME.target = null; GAME.bountyActive = false;
  PLAYER.credits = 6000;
  econInit();
  const nc = SYS["newconstantinople"];
  const home = nc.bases[0];
  GAME.ship = newShip("Llama.begin", GAME.system, V.add(home.pos, [22, 6, 14]));
  ensureBasis(GAME.ship);
  GAME.ship.fwd = V.norm(V.sub(home.pos, GAME.ship.pos));
  spawnSystemNPCs(GAME.system);
  GAME.started = true;
  simMsg("With Lauktk's death, ownership of this vessel has passed on to you. Make it count.");
  GAME.msgT = 8;
}

/* ---------- input ---------- */
const KEYS = {};
GAME.input = { pitch: 0, yaw: 0, roll: 0, thrust: 0, boost: false };
document.addEventListener("keydown", (e) => {
  if (e.key === "Tab") e.preventDefault();
  if (UI.mapOpen || UI.helpOpen || UI.aboutOpen) {
    if (e.key === "Escape" || e.key === "m" || e.key === "M" || e.key === "h" || e.key === "H") {
      UI.mapOpen = UI.helpOpen = UI.aboutOpen = false;
    }
    return;
  }
  if (GAME.docked) {
    if (e.key === "Escape") undock();
    return;
  }
  KEYS[e.key] = true;
  switch (e.key) {
    case "f": case "F": fireGun(GAME.ship); break;
    case "t": case "T": cycleTarget(); break;
    case "v": case "V":
      if (GAME.ship.fuel > 0.5) {
        GAME.ship.spec = !GAME.ship.spec;
        simMsg(GAME.ship.spec ? "SPEC drive engaged" : "SPEC disengaged");
        sfx.beep();
      } else { simMsg("No fuel for SPEC"); }
      break;
    case "n": case "N":
      GAME.ship.assist = !GAME.ship.assist;
      simMsg(GAME.ship.assist ? "Flight assist ON" : "Flight assist OFF - Newtonian flight");
      break;
    case "d": case "D": tryDock(); break;
    case "j": case "J": tryJump(); break;
    case "m": case "M": UI.mapOpen = true; break;
    case "h": case "H": UI.helpOpen = true; break;
    case "F5": e.preventDefault(); saveGame(); break;
  }
});
document.addEventListener("keyup", (e) => { delete KEYS[e.key]; });
function cycleTarget() {
  const enemies = GAME.npcs.filter(n => !n.dead);
  if (!enemies.length) { GAME.target = null; return; }
  let k = enemies.findIndex(n => n.id === GAME.target);
  GAME.target = enemies[(k + 1) % enemies.length].id;
  sfx.beep();
}
canvas.addEventListener("wheel", (e) => {
  if (GAME.docked) {
    UI.marketScroll += e.deltaY > 0 ? 3 : -3;
    e.preventDefault();
  }
}, { passive: false });
canvas.addEventListener("click", (e) => {
  const rc = canvas.getBoundingClientRect();
  const mx = (e.clientX - rc.left) * (800 / rc.width), my = (e.clientY - rc.top) * (600 / rc.height);
  audioCtx();
  for (const h of UI.hits) {
    if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) { h.cb(); return; }
  }
});

/* ---------- continuous input ---------- */
function gatherInput(dt) {
  const inp = GAME.input;
  inp.pitch = (KEYS["ArrowUp"] ? -1 : 0) + (KEYS["ArrowDown"] ? 1 : 0);
  inp.yaw = (KEYS["ArrowLeft"] ? -1 : 0) + (KEYS["ArrowRight"] ? 1 : 0);
  inp.roll = (KEYS["q"] || KEYS["Q"] ? 1 : 0) + (KEYS["e"] || KEYS["E"] ? -1 : 0);
  if (KEYS["w"] || KEYS["W"]) inp.thrust = Math.min(1, inp.thrust + dt * 1.5);
  if (KEYS["s"] || KEYS["S"]) inp.thrust = Math.max(0, inp.thrust - dt * 2);
  if (KEYS[" "]) inp.boost = true; else inp.boost = false;
  return inp;
}

/* ---------- mission hooks for kills ---------- */
function onNpcKilled(n) {
  if (n.kind === "pirate") {
    PLAYER.credits += 700;
    simMsg("Pirate destroyed - bounty +700 cr");
    for (const m of GAME.missions) if (m.kind === "bounty" && !m.done) m.killed++;
    sfx.hit();
  }
}

/* ---------- main loop ---------- */
var lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  UI.hits = [];
  UI.hudShake = Math.max(0, UI.hudShake - dt);
  const vw = 800, vh = 600;

  if (GAME.started && !GAME.over && !GAME.paused) {
    const simDt = dt;
    GAME.t += simDt;
    if (GAME.msgT > 0) GAME.msgT -= dt;
    if (!GAME.docked) {
      const inp = gatherInput(dt);
      flyShip(GAME.ship, inp, simDt);
      for (const n of GAME.npcs) npcTick(n, simDt);
      stepProjectiles(simDt);
      const dead = GAME.npcs.filter(n => n.dead);
      if (dead.length) {
        for (const n of dead) onNpcKilled(n);
        GAME.npcs = GAME.npcs.filter(n => !n.dead);
      }
      stepJump(simDt);
    }
    econTick(simDt);
  }
  sfx.update(dt);

  // render
  ctx.save();
  if (GAME.started) {
    renderScene(400, 300, vw, vh);
    renderHUD(vw, vh);
    if (GAME.docked && GAME.dockedOpen) renderStation(vw, vh);
    if (UI.mapOpen) renderMap(vw, vh);
    if (UI.helpOpen) renderHelp(vw, vh);
    if (GAME.over) renderOver(vw, vh);
  } else {
    renderTitle(vw, vh);
  }
  ctx.restore();
}

/* ---------- title ---------- */

  btn(vw / 2 - 70, 330, 140, 34, "START GAME", () => { audioCtx(); newGame(); }, { active: true });

}

function renderHelp(vw, vh) {

function renderOver(vw, vh) {

  ctx.fillStyle = "#ff6a5a"; ctx.font = "bold 26px 'Lucida Console', monospace";
  ctx.fillText("YOUR HULL IS GONE", vw / 2, 260);
  ctx.fillStyle = "#c8d0e8"; ctx.font = "12px 'Lucida Console', monospace";
  ctx.fillText("The Gemini sector will write your name in the ledger anyway.", vw / 2, 292);
  ctx.textAlign = "left";
  btn(vw / 2 - 120, 330, 110, 28, "RESTART", () => { newGame(); }, { active: true });
  btn(vw / 2 + 10, 330, 110, 28, "TITLE", () => { GAME.started = false; GAME.over = null; }, { dark: true });
}

/* ---------- JS self-test (same checks as verify_game.py) ---------- */
function simSelfTest() {
  const okConn = (() => {
    const adj = {}; VS_DATA.systems.forEach(s => adj[s.name] = []);
    VS_DATA.links.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
    const seen = new Set(["newconstantinople"]), st = ["newconstantinople"];
    while (st.length) for (const n of adj[st.pop()]) if (!seen.has(n)) { seen.add(n); st.push(n); }
    return seen.size === VS_DATA.systems.length;
  })();
  const bid = "newconstantinople::" + SYS["newconstantinople"].bases[0].name;
  econInit();
  const g = VS_DATA.goods.find(g => !g.cat.startsWith("Contraband"));
  const okMarket = goodPrice(bid, g.file) > 0 && baseStock0(bid, g.file) > 0;
  const ok = okConn && okMarket;
  console.log("[VS self-test] connectivity:", okConn, "| market:", okMarket, "|", ok ? "PASSED" : "FAILED");
  return ok;
}

/* ---------- boot ---------- */
makeTextures();
makeStars();
econInit();
UI.coreOK = simSelfTest();
requestAnimationFrame(frame);
// manual single-frame paint (headless test harness / debugging)
window.renderOne = function() { frame(performance.now()); GAME.msgT = Math.max(0, GAME.msgT - 0.05); };

</script>
